[package]
name = "orbit"
version = "0.2.0"
edition = "2021"
license = "MIT"
default-run = "orbit"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbit-core = { path = "../crates/orbit-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading",
  "Win32_System_Shutdown", "Win32_UI_Input_KeyboardAndMouse"
] }

[dev-dependencies]
tempfile = "3"
